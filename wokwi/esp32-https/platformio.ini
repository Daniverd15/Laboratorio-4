; PlatformIO - ESP32 - UNAB-Ambiental (Laboratorio 4) - tercer protocolo: HTTPS
; HTTPClient viene con el core Arduino-ESP32: no necesita libreria extra.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^6.21.5
